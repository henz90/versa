<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>VERSA</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpolygon points='16,2 28,9 28,23 16,30 4,23 4,9' fill='%2324243a' stroke='%23ffe066' stroke-width='3'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="dbWarn" role="alert" hidden></div>
  <div id="live" class="sr-only" aria-live="polite"></div>
  <div id="board">
    <div id="top"></div>
    <div id="svgwrap">
      <svg id="svg" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Game board. Use the to-do list and the panels below to act; the board itself needs a pointer or touch."></svg>
      <svg id="dragLayer" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"></svg>
      <svg id="animLayer" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"></svg>
      <div id="sideStack" aria-hidden="true"></div>
    </div>
    <div id="rollStage" aria-hidden="true"></div>
    <div id="cx"></div>
    <div id="todo"></div>
    <div id="defeated">☠ Defeated: you are observing the game</div>
    <div id="wheel"></div>
    <div id="fx"></div>
    <div id="bottom">
      <div id="bar"></div>
      <div id="panels">
        <div class="col" id="handcol">
          <button class="sec-head" data-action="show-hand">🃏 Hand</button>
          <div id="hand"></div>
        </div>
        <div class="col" id="buycol">
          <button class="sec-head" data-action="show-buy">🛒 Buy</button>
          <div id="buyside"></div>
        </div>
      </div>
    </div>
  </div>
  <div id="carry"></div>
  <div id="tip"></div>
  <div id="modal"></div>
  <div id="helpOverlay" role="dialog" aria-modal="true" aria-labelledby="helpTitle" hidden></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="game.js"></script>
</body>
</html>
