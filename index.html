<!doctype html>
<html><head><meta charset="utf-8"><title>VERSA lobby test</title>
<style>
body{font-family:system-ui,sans-serif;background:#0e0e12;color:#eee;padding:24px}
input,button{font-size:16px;padding:8px;margin:4px}
button:disabled{opacity:.4}
pre{background:#111;padding:12px;border-radius:6px;white-space:pre-wrap}
.hidden{display:none}
</style></head>
<body>
<h2>VERSA: connection test</h2>

<div id="nameBox">
  <label>Choose a username (2 to 16 letters or numbers): </label>
  <input id="name" maxlength="16" placeholder="Username">
  <button id="saveName">Continue</button>
</div>

<div id="roomBox" class="hidden">
  <div>Playing as <b id="whoami"></b> <button id="changeName">Change</button></div>
  <button id="create">Create room</button>
  <input id="code" placeholder="Room code" maxlength="6">
  <button id="join">Join room</button>
  <div id="room"></div>
</div>

<pre id="log"></pre>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const sb = supabase.createClient(
  'https://jbdfcqqobtatxmmhmipa.supabase.co',
  'sb_publishable_74fKEI9ilefM-7pR8A8bnw_cIYLsfqu'
);
const $ = id => document.getElementById(id);
const out = m => $('log').textContent += m + '\n';
let uid = null, code = null, username = localStorage.getItem('versa-name') || '';

function validName(n) { return /^[A-Za-z0-9]{2,16}$/.test(n); }

function showName() {
  $('whoami').textContent = username;
  $('nameBox').classList.toggle('hidden', !!username && validName(username));
  $('roomBox').classList.toggle('hidden', !username || !validName(username));
}

$('saveName').onclick = () => {
  const n = $('name').value.trim();
  if (!validName(n)) return out('Username must be 2 to 16 letters or numbers.');
  username = n;
  localStorage.setItem('versa-name', n);
  showName();
};

$('changeName').onclick = () => {
  localStorage.removeItem('versa-name');
  username = '';
  $('name').value = '';
  showName();
};

async function init() {
  const { data, error } = await sb.auth.signInAnonymously();
  if (error) return out('Sign-in failed: ' + error.message);
  uid = data.user.id;
  out('Signed in anonymously.');
}

function requireReady() {
  if (!uid) { out('Still signing in, try again in a moment.'); return false; }
  if (!username || !validName(username)) { out('Choose a username first.'); return false; }
  return true;
}

async function create() {
  if (!requireReady()) return;
  code = Math.random().toString(36).slice(2, 8).toUpperCase();
  const { error } = await sb.from('rooms').insert({ code, host: uid, players: [{ uid, name: username }] });
  if (error) return out('Create failed: ' + error.message);
  out('Room ' + code + ' created by ' + username + '. Share this code.');
  watch();
}

async function join() {
  if (!requireReady()) return;
  const c = $('code').value.trim().toUpperCase();
  const { data, error } = await sb.from('rooms').select('*').eq('code', c).single();
  if (error) return out('Join failed: ' + error.message);
  const players = data.players;
  if (players.some(p => p.uid === uid)) { code = c; out('Already in room ' + c); return watch(); }
  if (players.some(p => p.name.toLowerCase() === username.toLowerCase()))
    return out('That username is already taken in this room. Choose another.');
  if (players.length >= 6) return out('Room full');
  const { error: e2 } = await sb.from('rooms')
    .update({ players: [...players, { uid, name: username }] })
    .eq('code', c);
  if (e2) return out('Join update failed: ' + e2.message);
  code = c;
  out('Joined ' + c + ' as ' + username);
  watch();
}

function watch() {
  sb.channel('room-' + code)
    .on('postgres_changes', { event: '*', schema: 'public', table: 'rooms', filter: 'code=eq.' + code },
        payload => show(payload.new))
    .subscribe();
  sb.from('rooms').select('*').eq('code', code).single().then(({ data }) => show(data));
}

function show(r) {
  if (!r) return;
  $('room').innerHTML = '<b>Room ' + r.code + '</b><br>Players (' + r.players.length + '): ' +
    r.players.map(p => p.name).join(', ');
  out('Room update: ' + r.players.length + ' player(s)');
}

$('create').onclick = create;
$('join').onclick = join;
showName();
init();
</script>
</body></html>
